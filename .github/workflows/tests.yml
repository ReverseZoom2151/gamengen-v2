name: Quality

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pyyaml pytest tqdm pillow
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run offline unit tests
        run: python -m pytest -q
      - name: Verify repository metadata
        run: |
          test -f README.md
          test -f LICENSE
          test -f pyproject.toml
          test -d configs
          test -d tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff
      - name: Lint maintained foundation modules
        run: |
          ruff check \
            gamengen \
            src/config.py \
            src/agent/dqn_agent.py \
            src/diffusion/contracts.py \
            src/environment/doom_contracts.py \
            src/utils/data_recorder.py \
            src/utils/migration.py \
            src/utils/training.py
